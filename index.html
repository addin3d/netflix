<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="shortcut icon" href="icons/icon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080909" />
  <meta name="robots" content="index, follow">
  <meta property="og:url" content="https://flix.addin3d.com/" />
  <meta name="description"
    content="Movies for Friends & Family">
  <title>Addin's Netflix | Stream your next favorite</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
  <script defer src="https://www.googletagmanager.com/gtag/js?id=G-THTQ9GZQ0J">
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-THTQ9GZQ0J');
  </script>
<!-- Serviceworker code for PWA  -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').then(function(registration) {
          console.log('Service worker registered: ', registration.scope);
        }).catch(function(error) {
          console.log('Service worker registration failed: ', error);
        });
      });
    }
  </script>
</head>

<body>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="Addin's Netflix home">
      <img class="brand-logo" src="site-logo.png" alt="Addin's Netflix">
    </a>
    <nav class="main-nav" aria-label="Primary navigation">
      <a class="nav-link active" href="#home"><span class="nav-icon">⌂</span> Home</a>
      <a class="nav-link" href="#trending"><span class="nav-icon">▣</span> Movies</a>
      <a class="nav-link" href="#trending"><span class="nav-icon">▱</span> TV Shows</a>
      <a class="nav-link" href="#watchlist"><span class="nav-icon">♡</span> Watchlist</a>
    </nav>
    <button class="header-search" id="header-search" type="button" aria-label="Focus search">⌕</button>
  </header>

  <main id="home">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow">YOUR NEXT FAVORITE IS HERE</p>
        <h1 id="hero-title">Find stories<br><span>worth watching.</span></h1>
        <p class="hero-description">Movies for Friends &amp; Family</p>
        <div class="search-container">
          <input type="search" id="search-input" placeholder="Search movies, shows, or anime" aria-label="Search movies, shows, or anime">
          <button id="search-button" type="button"><span>⌕</span> Search</button>
        </div>
      </div>
    </section>

    <section class="content-section" id="trending" aria-labelledby="trending-title">
      <div class="section-heading"><h2 id="trending-title">Trending today</h2><span></span></div>
      <div id="trending-results" class="movie-grid" aria-live="polite"></div>
    </section>

    <section class="content-section search-results-section" id="search-results-section" aria-labelledby="results-title">
      <div class="section-heading"><h2 id="results-title">Search results</h2><span></span></div>
      <div id="results"></div>
    </section>

    <section id="video" class="video" aria-label="Video player">
      <iframe id="iframe" scrolling="no" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; scripts; same-origin; forms; presentation" allowfullscreen></iframe>
      <p class="player-note">Having trouble? Select the title again or try another player option.</p>
      <div id="webSeriesData"></div>
    </section>
  </main>

  <footer id="watchlist">
    <div class="footer-brand">ADDIN'S <span>NETFLIX</span></div>
    <div class="footer-links">
      <a href="/privacy-policy.html">Privacy</a>
      <a href="/terms-and-conditions.html">Terms</a>
      <a href="/contact.html">Contact</a>
    </div>
    <p>Discover more. Watch better.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/pace-js@latest/pace.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
